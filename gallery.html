<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nos Prestations</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .carousel-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-item {
            width: 100%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-media {
            max-height: 80vh;
            max-width: 100%;
            width: auto;
            border-radius: 8px;
            object-fit: contain;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-100">

    <!-- Back Button -->
    <a href="index.html"
        class="absolute top-4 left-4 bg-white bg-opacity-80 text-black px-4 py-2 rounded shadow hover:bg-opacity-100 transition">
        ⬅ Retour
    </a>

    <!-- Carousel -->
    <div class="carousel-container mt-10">
        <div id="carousel-slides" class="carousel-track"></div>

        <!-- Prev Button -->
        <button id="prev" class="absolute top-1/2 left-0 -translate-y-1/2 px-3 py-2 
                   bg-white bg-opacity-80 hover:bg-opacity-100 rounded-r-md shadow z-10">
            &#8592;
        </button>

        <!-- Next Button -->
        <button id="next" class="absolute top-1/2 right-0 -translate-y-1/2 px-3 py-2 
                   bg-white bg-opacity-80 hover:bg-opacity-100 rounded-l-md shadow z-10">
            &#8594;
        </button>
    </div>

    <script>
        const sets = {
            1: [
                "gallery/interieur/1.jpeg",
                "gallery/interieur/2.jpeg",
                "gallery/interieur/2.mp4",
                "gallery/interieur/3.jpeg",
                "gallery/interieur/4.jpeg",
                "gallery/interieur/5.jpeg",
                "gallery/interieur/6.jpeg",
                "gallery/interieur/7.jpeg",
                "gallery/interieur/8.jpeg",
                "gallery/interieur/9.jpeg",
                "gallery/interieur/10.jpeg",
                "gallery/interieur/11.jpeg",
                "gallery/interieur/12.jpeg",
                "gallery/interieur/13.jpeg"
            ],
            2: [
                "gallery/isolation/1.jpeg",
                "gallery/isolation/2.jpeg",
                "gallery/isolation/3.jpeg",
                "gallery/isolation/4.jpeg",
                "gallery/isolation/5.jpeg",
                "gallery/isolation/6.jpeg",
                "gallery/isolation/7.jpeg"
            ],
            3: [
                "gallery/exterieur/1.jpeg",
                "gallery/exterieur/2.jpeg",
                "gallery/exterieur/3.jpeg",
                "gallery/exterieur/4.jpeg",
                "gallery/exterieur/5.jpeg",
                "gallery/exterieur/6.jpeg",
                "gallery/exterieur/7.jpeg",
                "gallery/exterieur/8.jpeg"
            ]
        };

        const params = new URLSearchParams(window.location.search);
        const setNum = params.get("set") || "1";
        const mediaItems = sets[setNum] || sets[1];

        const slides = document.getElementById("carousel-slides");

        slides.innerHTML = mediaItems.map(src => {
            const isVideo = src.toLowerCase().endsWith(".mp4");
            return `
                <div class="carousel-item">
                    ${isVideo
                    ? `<video class="carousel-media" autoplay muted loop playsinline>
                                <source src="${src}" type="video/mp4" />
                                Your browser does not support the video tag.
                           </video>`
                    : `<img src="${src}" class="carousel-media" alt="Media">`
                }
                </div>`;
        }).join("");

        // Carousel logic
        let index = 0;
        const track = document.querySelector(".carousel-track");

        const updateCarousel = () => {
            track.style.transform = `translateX(-${index * 100}%)`;
        };

        const nextSlide = () => {
            index = (index + 1) % mediaItems.length;
            updateCarousel();
        };

        const prevSlide = () => {
            index = (index - 1 + mediaItems.length) % mediaItems.length;
            updateCarousel();
        };

        document.getElementById("next").addEventListener("click", nextSlide);
        document.getElementById("prev").addEventListener("click", prevSlide);

        // Keyboard control
        document.addEventListener("keydown", e => {
            if (e.key === "ArrowRight") nextSlide();
            if (e.key === "ArrowLeft") prevSlide();
        });

        // Touch swipe
        let startX = 0;

        slides.addEventListener("touchstart", e => {
            startX = e.touches[0].clientX;
        });

        slides.addEventListener("touchend", e => {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                diff > 0 ? nextSlide() : prevSlide();
            }
        });
    </script>

</body>

</html>
